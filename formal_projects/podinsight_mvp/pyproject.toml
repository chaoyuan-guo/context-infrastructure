[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "podinsight-mvp"
version = "0.1.0"
description = "Interview-demo PodInsight MVP over curated podcast transcripts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.54.0",
  "pydantic>=2.9.0",
  "streamlit>=1.39.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "basedpyright>=1.39.6",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
